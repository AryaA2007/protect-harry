<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protect Anuu: Cramp Battle</title>
<style>
:root{color-scheme:dark;--bg:#0d0b1a;--fg:#f3e9c6;--gold:#d4a73a;--card:#1c1833;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
body{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}
h1{font-size:18px;margin:2px 0;color:var(--gold);letter-spacing:1px;text-align:center}
#wrap{position:relative;width:min(100%,420px,calc((100dvh - 200px) * .6667))}
canvas{cursor:crosshair;width:100%;display:block;border:2px solid var(--gold);border-radius:12px;background:#120f26;touch-action:none}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px}
.row label{background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:6px 10px;cursor:pointer}
.row input{display:none}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:inherit;background:var(--gold);color:#1a1405;border:0;border-radius:10px;padding:10px 18px;font-weight:bold;cursor:pointer}
#cast{width:min(100%,420px);font-size:18px;padding:14px}
p.h{font-size:12px;opacity:.7;margin:0;text-align:center}
</style>
</head>

reset();
function cast(){if(st.phase!=='play'||st.cd>0)return;st.cd=.25;shout=SPELLS[Math.floor(Math.random()*SPELLS.length)];shoutT=.8;
 const tp=wpos(st.sx,H-150);const dx=aim.x-tp.tx,dy=Math.min(-40,aim.y-tp.ty),L=Math.hypot(dx,dy);st.bolts.push({x:tp.tx,y:tp.ty,vx:dx/L*620,vy:dy/L*620,c:['#ffd24a','#ff5a5a','#6cf'][Math.floor(Math.random()*3)]});

function update(d){
 if(st.phase==='play'){
  
  st.cd-=d;st.t+=d;st.sp-=d;
  if(st.sp<=0&&st.kills+st.en.length<GOAL){st.sp=.9;st.en.push({x:40+Math.random()*(W-80),y:-30,v:45+Math.random()*35+st.kills*1.5,n:NAMES[Math.floor(Math.random()*NAMES.length)],ph:Math.random()*6})}
  st.bolts.forEach(b=>{b.x+=b.vx*d;b.y+=b.vy*d});st.bolts=st.bolts.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
  st.en.forEach(e=>{e.y+=e.v*d;e.x+=Math.sin(st.t*2+e.ph)*30*d});
  st.bolts.forEach(b=>st.en.forEach(e=>{if(!e.dead&&!b.dead&&Math.hypot(b.x-e.x,b.y-e.y)<30){e.dead=1;b.dead=1;st.kills++;for(let i=0;i<10;i++)st.fx.push({x:e.x,y:e.y,vx:(Math.random()-.5)*240,vy:(Math.random()-.5)*240,l:.5,c:b.c})}}));
  st.bolts=st.bolts.filter(b=>!b.dead);
  st.en=st.en.filter(e=>{if(e.dead)return false;if(e.y>H-140){st.hearts--;flash=.3;return false}return true});
  if(st.hearts<=0)st.phase='lose';
  else if(st.kills>=GOAL&&st.en.length===0){st.phase='hug';shout='';}
 }else if(st.phase==='hug'){
  st.hugT+=d;const tx=W/2-34;st.sx+=(tx-st.sx)*Math.min(1,3*d);
  if(Math.random()<.15)st.fx.push({x:W/2+Math.random()*80-40,y:H-130,vx:(Math.random()-.5)*40,vy:-70-Math.random()*50,l:2,h:1});
 }
 st.fx.forEach(f=>{f.x+=f.vx*d;f.y+=f.vy*d;f.l-=d});st.fx=st.fx.filter(f=>f.l>0);
 shoutT-=d;flash-=d;
}
